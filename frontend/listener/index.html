<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12181a">
<title>BuschFunk</title>
<style>
  /* Keine externen Fonts - im Lager-WLAN gibt es oft kein Internet. */
  :root {
    --bg: #12181a; --bg-hatch: #0e1315; --panel: #1b2224; --panel-raised: #212a2c;
    --border: #2c3638; --text: #ece7dd; --text-muted: #8b9695; --text-faint: #5a6465;
    --onair: #e24e3a; --onair-dim: #4a231c; --live-green: #4fa37b;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: repeating-linear-gradient(135deg, var(--bg-hatch) 0px, var(--bg-hatch) 1px, transparent 1px, transparent 14px);
    color: var(--text); font-family: var(--sans); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .card { width: min(430px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .brand { font-weight: 700; font-size: 21px; }
  .brand small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .now { margin-top: 20px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-raised); }
  .onair-status { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-muted); }
  .onair-status i { width: 10px; height: 10px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .onair-status.live { color: var(--onair); }
  .onair-status.live i { background: var(--onair); box-shadow: 0 0 8px var(--onair); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .onair-status.live i { animation: none; } }

  .playbar { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .play-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--onair); background: var(--onair-dim);
    color: var(--onair); font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .play-btn:hover { background: var(--onair); color: #1a0d0a; }
  .play-btn:active { transform: scale(0.96); }
  .play-btn.loading { border-style: dashed; }
  .play-info { min-width: 0; }
  .play-status { font-family: var(--mono); font-size: 12.5px; color: var(--text-muted); }
  .play-status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); margin-right: 7px; }
  .play-status.live .dot { background: var(--live-green); box-shadow: 0 0 6px var(--live-green); }
  .play-status.error .dot { background: var(--onair); }
  .play-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  .tap-hint { margin-top: 14px; border: 1px solid var(--onair); background: var(--onair-dim); color: var(--text);
    border-radius: var(--radius); padding: 13px; font-size: 13.5px; text-align: center; width: 100%; font-weight: 600; }


  .admin-link { display: block; text-align: center; margin-top: 20px; font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-decoration: none; padding: 6px; }
  .admin-link:hover { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">BuschFunk<small>Lagerradio</small></div>

    <div class="now">
      <div class="onair-status" id="onairStatus"><i></i><span id="onairText">Nicht live</span></div>
    </div>

    <div class="playbar">
      <button class="play-btn" id="playBtn" aria-label="Wiedergabe starten">▶</button>
      <div class="play-info">
        <div class="play-status" id="playStatus"><span class="dot"></span>Verbinde…</div>
        <div class="play-hint" id="playHint">Läuft weiter, auch wenn du das Handy sperrst.</div>
      </div>
    </div>

    <button class="tap-hint" id="tapHint" hidden>▶ Antippen, um den Stream zu starten</button>

    <a class="admin-link" href="/admin/">Admin →</a>
  </div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const audio = new Audio();
  audio.preload = 'none';
  audio.autoplay = false;
  audio.setAttribute('playsinline', '');

  let streamUrl = '/stream';
  let wantPlay = false;        // Absicht der hörenden Person - überlebt Netzaussetzer
  let retryDelay = 1000;
  let retryTimer = null;

  const playBtn = $('playBtn'), playStatus = $('playStatus'), tapHint = $('tapHint');

  function setStatus(text, kind) {
    playStatus.innerHTML = '<span class="dot"></span>' + text;
    playStatus.className = 'play-status' + (kind ? ' ' + kind : '');
  }
  function setButton(isPlaying) {
    playBtn.textContent = isPlaying ? '■' : '▶';
    playBtn.setAttribute('aria-label', isPlaying ? 'Wiedergabe stoppen' : 'Wiedergabe starten');
  }

  // Immer frisch an die Live-Kante verbinden statt in einem alten Puffer zu landen.
  function freshUrl() { return streamUrl + (streamUrl.includes('?') ? '&' : '?') + '_=' + Date.now(); }

  function start(userGesture) {
    wantPlay = true;
    clearTimeout(retryTimer);
    setStatus('Verbinde…');
    if (userGesture) setButton(true);
    audio.src = freshUrl();
    audio.load();
    const p = audio.play();
    if (p && p.catch) {
      p.then(() => { tapHint.hidden = true; }).catch((err) => {
        if (err && err.name === 'NotAllowedError' && !userGesture) {
          // Browser verlangt eine echte Nutzeraktion - erst dann darf Ton laufen.
          wantPlay = false;
          setButton(false);
          setStatus('Bereit', null);
          tapHint.hidden = false;
        } else {
          scheduleRetry();
        }
      });
    }
  }

  function stop() {
    wantPlay = false;
    clearTimeout(retryTimer);
    audio.pause();
    setButton(false);
    setStatus('Gestoppt');
  }

  function scheduleRetry() {
    if (!wantPlay) return;
    setStatus('Keine Verbindung – versuche erneut…', 'error');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
      if (!wantPlay) return;
      audio.src = freshUrl();
      audio.load();
      audio.play().catch(() => scheduleRetry());
    }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 10000);
  }

  audio.addEventListener('playing', () => {
    retryDelay = 1000;
    tapHint.hidden = true;
    setStatus('Live', 'live');
    setButton(true);
    updateMediaSession();
  });
  audio.addEventListener('waiting', () => { if (wantPlay) setStatus('Puffert…'); });
  audio.addEventListener('stalled', () => { if (wantPlay) scheduleRetry(); });
  audio.addEventListener('ended', () => { if (wantPlay) scheduleRetry(); });
  audio.addEventListener('error', () => { if (wantPlay) scheduleRetry(); });
  audio.addEventListener('pause', () => { if (!wantPlay) setStatus('Gestoppt'); });

  playBtn.addEventListener('click', () => { wantPlay ? stop() : start(true); });
  tapHint.addEventListener('click', () => start(true));

  // ---------- Hintergrund-Wiedergabe / Sperrbildschirm ----------
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'BuschFunk',
      artist: 'Lagerradio',
      album: 'BuschFunk',
    });
    navigator.mediaSession.playbackState = wantPlay ? 'playing' : 'paused';
  }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => start(true));
    navigator.mediaSession.setActionHandler('pause', () => stop());
    navigator.mediaSession.setActionHandler('stop', () => stop());
    updateMediaSession();
  }

  // Kommt das Gerät aus dem Standby und der Stream ist gestorben: still nachfassen.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wantPlay && audio.paused) scheduleRetry();
  });
  window.addEventListener('online', () => { if (wantPlay && audio.paused) { retryDelay = 1000; scheduleRetry(); } });

  // ---------- Start ----------
  fetch('/api/system/stream-info')
    .then((r) => r.json())
    .then((info) => { streamUrl = location.origin + info.mount; })
    .catch(() => {})
    .finally(() => {
      // Autostart versuchen; blockt der Browser, erscheint der grosse Tipp-Knopf.
      start(false);
    });

  // ---------- On-Air-Status (öffentlich, kein Login nötig) ----------
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    try { ws = new WebSocket(proto + '//' + location.host + '/ws/live'); } catch (e) { setTimeout(connectWS, 3000); return; }
    ws.onmessage = (ev) => {
      let state;
      try { state = JSON.parse(ev.data); } catch (e) { return; }
      if (state.type !== 'live_state') return;
      const onAir = !!state.on_air;
      $('onairStatus').className = 'onair-status' + (onAir ? ' live' : '');
      $('onairText').textContent = onAir ? 'ON AIR' : 'Nicht live';
      if (wantPlay) updateMediaSession();
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connectWS();

})();
</script>
</body>
</html>
