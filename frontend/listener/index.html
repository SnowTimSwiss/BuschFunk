<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuschFunk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181a; --bg-hatch: #0e1315; --panel: #1b2224; --panel-raised: #212a2c;
    --border: #2c3638; --text: #ece7dd; --text-muted: #8b9695; --text-faint: #5a6465;
    --onair: #e24e3a; --onair-dim: #4a231c; --live-green: #4fa37b;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Inter', system-ui, sans-serif; --radius: 3px;
  }
  :root[data-theme="light"] { --bg: #e9e4d8; --bg-hatch: #ded8c9; --panel: #f4f0e6; --panel-raised: #faf7f0; --border: #cfc7b4; --text: #1c2222; --text-muted: #5c6564; --text-faint: #8a9190; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #e9e4d8; --bg-hatch: #ded8c9; --panel: #f4f0e6; --panel-raised: #faf7f0; --border: #cfc7b4; --text: #1c2222; --text-muted: #5c6564; --text-faint: #8a9190; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: repeating-linear-gradient(135deg, var(--bg-hatch) 0px, var(--bg-hatch) 1px, transparent 1px, transparent 14px);
    color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
  .brand { font-weight: 700; font-size: 20px; margin-bottom: 2px; }
  .brand small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .now { margin-top: 22px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-raised); min-height: 46px; }
  .now .lbl { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; }
  .now .title { font-size: 14.5px; font-weight: 600; margin-top: 4px; }

  .playbar { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
  .play-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--onair); background: var(--onair-dim);
    color: var(--onair); font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
  }
  .play-btn:hover { background: var(--onair); color: #1a0d0a; }
  .play-status { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .play-status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); margin-right: 6px; }
  .play-status.live .dot { background: var(--live-green); box-shadow: 0 0 6px var(--live-green); }

  .schedule { margin-top: 26px; }
  .section-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 10px; }
  .sched-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sched-row:last-child { border-bottom: none; }
  .sched-row .day { color: var(--text-muted); font-family: var(--mono); font-size: 11.5px; width: 84px; flex-shrink: 0; }
  .sched-row .time { font-family: var(--mono); color: var(--text-faint); font-size: 11.5px; }
  .empty { color: var(--text-faint); font-size: 12.5px; }

  .admin-link { display: block; text-align: center; margin-top: 22px; font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-decoration: none; }
  .admin-link:hover { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">BuschFunk<small>Lagerradio · Regiolager 27</small></div>

    <div class="now">
      <div class="lbl">LÄUFT GERADE</div>
      <div class="title" id="nowTitle">–</div>
    </div>

    <div class="playbar">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="play-status" id="playStatus"><span class="dot"></span>Nicht verbunden</div>
    </div>

    <div class="schedule">
      <div class="section-label">Sendezeiten</div>
      <div id="scheduleList"><div class="empty">Lade...</div></div>
    </div>

    <a class="admin-link" href="/admin/">Admin →</a>
  </div>

<script>
(function () {
  "use strict";

  const audio = new Audio();
  audio.preload = "none";
  let playing = false;

  const playBtn = document.getElementById('playBtn');
  const playStatus = document.getElementById('playStatus');

  function setStatus(text, live) {
    playStatus.innerHTML = '<span class="dot"></span>' + text;
    playStatus.classList.toggle('live', !!live);
  }

  let streamUrl = '/stream';
  fetch('/api/system/stream-info').then((r) => r.json()).then((info) => {
    streamUrl = location.origin + info.mount;
  }).catch(() => {});

  audio.addEventListener('playing', () => setStatus('Live', true));
  audio.addEventListener('waiting', () => setStatus('Verbinde...', false));
  audio.addEventListener('error', () => { setStatus('Stream nicht erreichbar', false); playing = false; playBtn.textContent = '▶'; });
  audio.addEventListener('pause', () => { if (!playing) setStatus('Gestoppt', false); });

  playBtn.addEventListener('click', () => {
    if (playing) {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      playing = false;
      playBtn.textContent = '▶';
      setStatus('Gestoppt', false);
    } else {
      setStatus('Verbinde...', false);
      audio.src = streamUrl + '?_=' + Date.now(); // frischer Connect an die Live-Kante, kein alter Puffer
      audio.play().catch(() => setStatus('Wiedergabe blockiert – nochmal tippen', false));
      playing = true;
      playBtn.textContent = '■';
    }
  });

  // aktueller Titel per WebSocket (öffentlich, kein Login nötig)
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws/live');
    ws.onmessage = (ev) => {
      const state = JSON.parse(ev.data);
      document.getElementById('nowTitle').textContent =
        state.is_on_air && state.current_segment_title ? state.current_segment_title : 'Playlist / kein Live-Segment';
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  }
  connectWS();

  // öffentliche Sendezeiten
  fetch('/api/schedule').then((r) => r.json()).then((entries) => {
    const el = document.getElementById('scheduleList');
    if (!entries.length) { el.innerHTML = '<div class="empty">Noch keine Sendezeiten veröffentlicht.</div>'; return; }
    el.innerHTML = '';
    entries.forEach((e) => {
      const row = document.createElement('div');
      row.className = 'sched-row';
      row.innerHTML = '<span class="day"></span><span class="title"></span><span class="time"></span>';
      row.querySelector('.day').textContent = e.day;
      row.querySelector('.title').textContent = e.title;
      row.querySelector('.time').textContent = e.from_time + '–' + e.to_time;
      el.appendChild(row);
    });
  }).catch(() => { document.getElementById('scheduleList').innerHTML = '<div class="empty">Sendezeiten konnten nicht geladen werden.</div>'; });
})();
</script>
</body>
</html>
